    <path d="M321 450h32l10 82 1 22h-36l-4-18Z" fill="#e7a97e" stroke="#d49970" stroke-width="3"/>
    <path d="M264 517h35l-3 34h-37Z" fill="#fff6e9"/>
    <path d="M326 517h35l4 34h-37Z" fill="#fff6e9"/>
    <path d="M262 544h35l8 15q2 10-12 12h-53q-14-2-9-11l20-13Zm65 0h38l22 15q7 10-8 12h-56q-12-2-8-12Z" fill="#f9faf1" stroke="#60766b" stroke-width="4"/>
    <path d="M238 559h65m13 0h69" stroke="#9eb9a7" stroke-width="3"/>
    <!-- relaxed left arm, raised right arm reaching toward the basketball -->
    <path d="M264 323q-21-2-29 25l-17 69q-3 12 8 17l17 5q10 2 14-11l17-60Z" fill="#edb486" stroke="#d49970" stroke-width="4"/>
    <path d="M226 424q-7 9-4 20l6 15q6 9 13 5l9-11q6-10-1-17Z" fill="#edb486" stroke="#d49970" stroke-width="3"/>
    <path d="M354 322q22-5 33 17l27 42 24-41q6-11 16-5 9 5 3 16l-29 65q-9 16-24 5l-42-45Z" fill="#edb486" stroke="#d49970" stroke-width="4"/>
    <path d="M435 345q-2-13 3-22l12-18q5-8 10-4 4 4-1 14l11-16q6-7 10-2 3 4-3 12l-11 18q16-11 19-5 4 8-14 21l-19 18Z" fill="#edb486" stroke="#d49970" stroke-width="3"/>
    <!-- shorts and torso overlap at the waist, so the hips and legs read as one body -->
    <path d="M267 424q42 12 84 0l9 47-43 1-9-22-8 22-43-2Z" fill="#38645e" stroke="#2e5751" stroke-width="4"/>
    <path d="M274 304q-28 4-28 34l14 97q48 22 99 0l13-97q-2-29-27-34l-35 13Z" fill="url(#shirt)" stroke="#d67c58" stroke-width="4"/>
    <path d="M262 419q49 19 95 0" fill="none" stroke="#ffd2a1" stroke-width="4" opacity=".9"/>
    <path d="M294 293v30q15 12 31 0v-30" fill="#e2a17b"/>
