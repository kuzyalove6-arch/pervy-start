<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 600" role="img" aria-label="Ребёнок выбирает спорт среди мяча, ракетки, гимнастической ленты и плавательных очков">
  <defs>
    <linearGradient id="sky" x2="1" y2="1"><stop stop-color="#eaf3e8"/><stop offset="1" stop-color="#d0e7da"/></linearGradient>
    <linearGradient id="shirt" x2="1" y2="1"><stop stop-color="#ffb675"/><stop offset="1" stop-color="#ee815e"/></linearGradient>
    <filter id="shade" x="-35%" y="-35%" width="170%" height="180%"><feDropShadow dy="11" stdDeviation="10" flood-color="#345a4a" flood-opacity=".16"/></filter>
  </defs>
  <rect width="620" height="600" rx="28" fill="url(#sky)"/>
  <circle cx="310" cy="280" r="226" fill="#f6faf0" opacity=".64"/>
  <circle cx="310" cy="280" r="245" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="3 13" opacity=".85"/>
  <circle cx="310" cy="280" r="179" fill="none" stroke="#7fb399" stroke-width="2" stroke-dasharray="7 13" opacity=".7"/>
  <path d="M0 520q150-40 316-12t304-6v98H0Z" fill="#99bea5" opacity=".5"/>
  <!-- floating equipment arranged on the choice circle -->
  <g filter="url(#shade)">
    <g transform="translate(55 90)"><circle cx="60" cy="60" r="54" fill="#fff"/><circle cx="60" cy="60" r="53" fill="none" stroke="#d3ded3" stroke-width="2"/><path d="m60 29 23 16-9 28H47l-10-28Zm0-21-8 19 8 2 17-12M11 47l21 3 5-5-5-20m-6 81 19-8 2-25-25-9m96 23-18-8-26-6 9 25M66 114l-19-16 0-25" fill="#32493e"/></g>
    <g transform="translate(435 93)"><circle cx="52" cy="52" r="51" fill="#f5dcae"/><circle cx="52" cy="52" r="43" fill="#f0a664" stroke="#af653e" stroke-width="2"/><path d="M9 52h86M52 9v86M18 27q73 24 68 54M86 23Q20 43 18 78" stroke="#a96442" stroke-width="3" fill="none"/></g>
    <g transform="translate(27 315)"><circle cx="66" cy="64" r="61" fill="#f7e5dd"/><ellipse cx="53" cy="49" rx="27" ry="36" transform="rotate(-32 53 49)" fill="#fff" stroke="#385846" stroke-width="7"/><path d="m70 77 29 33M27 50l50 7M32 34l53 8M44 19l42 6M45 14l-2 69M60 16l-2 66" stroke="#6a9879" stroke-width="3"/><circle cx="97" cy="34" r="11" fill="#d0e686"/></g>
    <g transform="translate(448 309)"><circle cx="59" cy="58" r="58" fill="#b8e0e8"/><path d="M14 77q18-15 36 0t36 0 19 0M14 92q18-15 36 0t36 0 19 0" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round"/><path d="M20 40q12-13 30-7l10 9 9-9q19-6 30 7l-5 21q-18 10-30-2H55Q43 71 25 61Z" fill="#31758b"/><path d="M24 45q13-11 26-4l5 10q-11 13-27 4Zm72 0q-13-11-26-4L65 51q11 13 27 4Z" fill="#e9faff"/></g>
    <g transform="translate(175 26)"><circle cx="52" cy="50" r="43" fill="#efe5f7"/><path d="M43 20q-8 31 15 32 31 0 15 28-12 12-33 0-19-17-5-32" fill="none" stroke="#b582ca" stroke-width="7" stroke-linecap="round"/><path d="m36 41-12-19m6 30-18-10m27 31-18 8" stroke="#b582ca" stroke-width="3" stroke-linecap="round"/></g>
    <g transform="translate(348 17)"><circle cx="44" cy="44" r="38" fill="#e0ecce"/><path d="M26 17h36v40H26z" fill="#f9fcf4" stroke="#608c63" stroke-width="4"/><path d="M26 33h36M44 17v40" stroke="#a9c8a2" stroke-width="2"/><path d="m44 58-8 19m9-19 9 19" stroke="#608c63" stroke-width="4"/><circle cx="63" cy="22" r="6" fill="#eea669"/></g>
  </g>
  <!-- One continuous figure facing the viewer and choosing a sport -->
  <g filter="url(#shade)" stroke-linejoin="round" stroke-linecap="round">
    <ellipse cx="309" cy="570" rx="105" ry="15" fill="#4d785e" opacity=".2"/>
