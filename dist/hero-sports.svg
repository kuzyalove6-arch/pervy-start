    <ellipse cx="310" cy="228" rx="58" ry="72" fill="#e9ae85"/>
    <path d="M255 235q-13-75 46-86 56-10 65 54 4 17-2 35-12-18-13-44-21 20-54 10-23-7-42 31Z" fill="#423b36"/>
    <path d="M255 237q-12-13-4-35 3-28 23-41-11 27-4 52m83-13q17-24 3-43 25 17 13 56" fill="#423b36"/>
    <path d="M280 236q10-7 20 0m20 0q10-7 20 0" fill="none" stroke="#805744" stroke-width="3" stroke-linecap="round" opacity=".7"/>
    <ellipse cx="291" cy="248" rx="5" ry="6" fill="#3d3934"/><ellipse cx="329" cy="248" rx="5" ry="6" fill="#3d3934"/>
    <circle cx="292" cy="246" r="1.5" fill="#fff8ed"/><circle cx="330" cy="246" r="1.5" fill="#fff8ed"/>
    <path d="M292 271q18 17 36 0" fill="none" stroke="#a86146" stroke-width="4" stroke-linecap="round"/>
    <path d="M299 355q16 14 29 0" fill="none" stroke="#ffe2b2" stroke-width="5" opacity=".8"/>
  </g>
  <g fill="#eda274"><path d="m164 251 5 12 12 5-12 5-5 12-5-12-12-5 12-5Z"/><path d="m455 224 5 12 12 5-12 5-5 12-5-12-12-5 12-5Z"/></g>
</svg>
